name: BGFN daily market brief

# 每个交易日北京时间 16:30（UTC 08:30）跑一次，A 股已收盘。
# 周末也会跑，但指数不变，等于重复同一期，页面会显示同样的数字。
on:
  schedule:
    - cron: "30 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bgfn-brief
  cancel-in-progress: true

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch quotes
        run: python bgfn/scripts/fetch_market.py

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bgfn/data
          if git diff --staged --quiet; then
            echo "行情无变化"
          else
            git commit -m "chore(bgfn): 更新每日行情 [skip ci]"
            git push
          fi

      - name: Summary
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("bgfn/data/latest.json")
          if not p.exists():
              print(":warning: latest.json 未生成")
          else:
              d = json.loads(p.read_text(encoding="utf-8"))
              for it in d.get("indices", []):
                  print(f"{it['name']} {it['value']:.2f} {it['pct']:+.2f}%")
          PY
